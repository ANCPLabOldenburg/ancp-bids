[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancpbids"
dynamic = ["version"]
description = "Read/write/validate/query BIDS datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Erdal Karaca", email = "erdal.karaca.de@gmail.com" },
]
maintainers = [
    { name = "ANCP Lab, University of Oldenburg", email = "currentancp@listserv.uni-oldenburg.de" },
]
keywords = ["BIDS", "neuroimaging", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas"]
torch = ["torch"]
validation = ["nibabel"]
docs = [
    "sphinx-copybutton>=0.5.0",
    "sphinx-inline-tabs",
    "sphinxcontrib-napoleon",
]

[project.urls]
Homepage = "https://github.com/ANCPLabOldenburg/ancp-bids"
Documentation = "https://ancpbids.readthedocs.io"
Repository = "https://github.com/ANCPLabOldenburg/ancp-bids"
Issues = "https://github.com/ANCPLabOldenburg/ancp-bids/issues"

# Built-in and third-party plugins share this group. Prefer @hook(ranking=...) on
# each class. Loaded at import via load_plugins_from_entrypoints().
[project.entry-points."ancpbids.plugins"]
dataset_population = "ancpbids.plugins.plugin_dsloader:DatasetPopulationPlugin"
dataset_writing = "ancpbids.plugins.plugin_dssaver:DatasetWritingPlugin"
files_handler = "ancpbids.plugins.plugin_files_handlers:FilesHandlerPlugin"
schema_files = "ancpbids.plugins.plugin_schema_validator:SchemaFilesPlugin"
schema_entities = "ancpbids.plugins.plugin_schema_validator:SchemaEntitiesPlugin"
schema_directories = "ancpbids.plugins.plugin_schema_validator:SchemaDirectoriesPlugin"
schema_sidecars = "ancpbids.plugins.plugin_schema_validator:SchemaSidecarsPlugin"
schema_json = "ancpbids.plugins.plugin_schema_validator:SchemaJsonPlugin"
schema_tabular_data = "ancpbids.plugins.plugin_schema_validator:SchemaTabularDataPlugin"
schema_dataset_metadata = "ancpbids.plugins.plugin_schema_validator:SchemaDatasetMetadataPlugin"
schema_checks = "ancpbids.plugins.plugin_schema_validator:SchemaChecksPlugin"

# Built-in and third-party @mixin contributions. Loaded via load_mixins_from_entrypoints().
[project.entry-points."ancpbids.mixins"]
to_df = "ancpbids.mixins.mixin_dataframe:DataFrameMixin"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pandas",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ancpbids*"]

[tool.setuptools.package-data]
ancpbids = ["schema/versions/*.json", "schema/stubs/*.pyi", "py.typed"]

[tool.setuptools_scm]
version_file = "ancpbids/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.ruff]
line-length = 127
target-version = "py38"
exclude = [
    ".venv",
    "build",
    "dist",
    ".git",
    "__pycache__",
    "ancpbids/_version.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C90", # mccabe complexity
]
ignore = [
    "E501", # long lines (docstrings / test data); line-length still guides formatter
    "E731", # lambda assignments in query filters
    "E721", # type(...) is type comparisons
    "E722", # bare except in file handlers
    "C901", # complexity debt (e.g. query)
    "F403", # star imports
    "F405", # names from star imports
]

[tool.ruff.lint.per-file-ignores]
"ancpbids/__init__.py" = [
    "E402", # deferred public re-exports
    "F401", # public API re-exports
]
"tests/**" = [
    "F841", # unused locals in manual / exploratory tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv]
default-groups = ["dev"]
