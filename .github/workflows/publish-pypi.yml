name: Publish to PyPi

on:
  release:
    types: [published]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.14"
    - name: Build and publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: |
        echo "Building from tag/ref: ${GITHUB_REF_NAME}"
        uv build
        ls -la dist/
        # Refuse .dev / local versions (tag must match a clean release commit)
        if ls dist/*.whl | grep -E '\.dev|[+]'; then
          echo "Refusing to publish a non-release version. Tag a clean commit."
          exit 1
        fi
        uv publish
