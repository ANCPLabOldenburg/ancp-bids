name: Performance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  performance:
    name: Performance regression
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync
    - name: Run performance benchmark
      run: |
        mkdir -p benchmarks
        uv run python tools/bench_performance.py \
          --preset medium \
          --warmup 1 \
          --repeats 3 \
          -o benchmarks/latest.json
        cat benchmarks/latest.json
    - name: Compare against committed baseline
      id: compare
      run: |
        echo "Baseline source: committed (benchmarks/baseline.json)"
        # Shared runners swing validate ~30% for the same workload; require both
        # a relative and an absolute overrun before failing.
        uv run python tools/compare_performance.py \
          --current benchmarks/latest.json \
          --baseline benchmarks/baseline.json \
          --threshold 0.35 \
          --min-absolute-seconds 4 \
          --require-baseline
    - name: Informational compare vs last successful main artifact
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p benchmarks/from-ci
        RUN_ID="$(gh run list \
          --workflow performance.yml \
          --branch main \
          --status success \
          --limit 20 \
          --json databaseId \
          --jq '.[].databaseId' | head -n 1 || true)"
        if [ -z "${RUN_ID}" ]; then
          echo "No previous successful Performance run found; skipping artifact compare."
          exit 0
        fi
        if ! gh run download "${RUN_ID}" --name perf-metrics --dir benchmarks/from-ci; then
          echo "No perf-metrics artifact on run ${RUN_ID}; skipping."
          exit 0
        fi
        if [ ! -f benchmarks/from-ci/latest.json ]; then
          echo "Artifact missing latest.json; skipping."
          exit 0
        fi
        echo "Informational compare vs artifact from run ${RUN_ID} (not gated):"
        uv run python tools/compare_performance.py \
          --current benchmarks/latest.json \
          --baseline benchmarks/from-ci/latest.json \
          --threshold 0.35 \
          --min-absolute-seconds 4 || true
    - name: Upload metrics artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: perf-metrics
        path: benchmarks/latest.json
        retention-days: 90
    - name: Job summary
      if: always()
      run: |
        {
          echo "## Performance"
          echo ""
          echo "- Baseline source: \`committed\` (\`benchmarks/baseline.json\`)"
          echo "- Gate: +35% **and** +4s absolute (validate / load+validate; load info-only)"
          echo "- Commit: \`${{ github.sha }}\`"
          echo ""
          echo '```json'
          cat benchmarks/latest.json
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
